name: Bug
description: 既存の可視化、操作、表示の不具合を修正する
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: 実際に起きていることを書きます。
      placeholder: 例：mobile で playback dock が Step Log に重なる。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 本来どう動くべきかを書きます。
      placeholder: 例：dock は画面下部に固定され、主要パネルを隠さない。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: 再現手順を書きます。
      placeholder: |
        1. Buffer Pool を開く
        2. mobile viewport にする
        3. Next を押す
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: 学習体験や操作にどう影響するかを書きます。
      placeholder: 例：step 説明を追いながら操作できない。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: 修正後に確認する観点を書きます。
      placeholder: |
        - npm run build
        - npm run test:e2e
    validations:
      required: false
